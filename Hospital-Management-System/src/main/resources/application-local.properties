# Local profile: file-based H2 so the API can run without MySQL.
# Switch to MySQL later with: SPRING_PROFILES_ACTIVE=default

spring.datasource.url=jdbc:h2:file:./data/hospital_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.hibernate.orm.deprecation=OFF
spring.main.banner-mode=console
